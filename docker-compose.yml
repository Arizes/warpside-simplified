# Local equivalent of the Railway deployment: the same image, the same variables.
# Reads .env (copy .env.example). Postgres is here ready for migration phase 2; the app
# does not use it yet.
services:
  app:
    build: .
    ports:
      - '8080:8080'
    environment:
      CENSUS_SERVICE_ID: ${CENSUS_SERVICE_ID:?set it in .env}
      DATABASE_URL: postgres://warpside:warpside@postgres:5432/warpside
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      ORIGIN_SECRET: ${ORIGIN_SECRET:-}
      RETAIN_HOURS: ${RETAIN_HOURS:-24}
    volumes:
      - app-data:/data
      # Map tiles and sounds are not in the image; mount them to serve the page locally.
      - ./public:/app/public:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: warpside
      POSTGRES_PASSWORD: warpside
      POSTGRES_DB: warpside
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U warpside']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  app-data:
  pg-data:
